# Copy to config.yaml and edit. Every key is optional -- anything you leave
# out keeps its default, and the app runs fine with no config file at all.

camera:
  # auto tries the Pi camera first, then a USB webcam, then a synthetic test
  # pattern. Force it to picamera2 if you want a hard failure when the ribbon
  # cable is loose rather than a silent fallback.
  source: auto
  width: 1280
  height: 720
  # Detections per second. The Pi cannot do 30 -- and does not need to, since
  # objects stay in frame for seconds. 3-5 is a good range on a Pi 5, 1-2 on a
  # Pi 4 or Zero 2.
  fps_limit: 4
  # 0, 90, 180 or 270. Camera Module 3 mounted upside down? Use 180.
  rotation: 0
  hflip: false
  vflip: false

detector:
  # auto = Hailo accelerator if present, else onnx, else ultralytics, else the
  # mock detector so the page still does something.
  backend: auto
  model: models/yolo11n.onnx

  # --- Hailo AI HAT+ / AI Kit -------------------------------------------
  # Only used by the hailo backend. See scripts/hailo_probe.py.
  # Leave empty to auto-discover a .hef in /usr/share/hailo-models and the
  # other usual places.
  hef: ""
  # Class names for that model, in training order. Empty = COCO's 80, which is
  # right for the stock YOLO builds.
  labels: []
  # Letterbox before inference (preserve aspect ratio). Set false if boxes come
  # out consistently offset or squashed -- it depends how the .hef was built.
  hailo_letterbox: true
  # ----------------------------------------------------------------------
  # Raise towards 0.6 if the log fills with nonsense; lower towards 0.3 if it
  # is missing obvious things.
  confidence: 0.40
  iou: 0.45
  input_size: 640
  # Only log these classes. Empty means everything the model knows.
  # Indoors, an allow-list is by far the most effective anti-nonsense setting:
  #   classes: [person, cat, dog, cup, bottle, laptop, cell phone, keyboard,
  #             mouse, book, chair, tv, backpack, scissors]
  classes: []

  # ...or, if you would rather keep everything except a few offenders, name
  # them here. Run `python3 scripts/tune.py` to find out which ones your room
  # actually produces. A COCO model indoors loves to see cars in furniture:
  #   exclude_classes: [car, truck, bus, train, boat, airplane, bench]
  exclude_classes: []

  # Ignore boxes smaller than this fraction of the frame -- kills distant
  # noise, e.g. a "person" made of six pixels at the end of the garden.
  min_box_area: 0.004
  # ...and bigger than this. A detector that has locked onto a desk or a wall
  # usually reports a box covering most of the view. 0.45 is a good value
  # indoors if something large and static keeps being logged.
  max_box_area: 1.0

  # Rectangles to ignore, as fractions of the frame [x0, y0, x1, y1].
  # Anything whose centre lands inside one is discarded. Use this for a patch
  # that reliably fools the detector -- a wood-grain desktop, a patterned rug.
  # Note the trade-off: real objects in that area are ignored too.
  #   ignore_regions:
  #     - [0.0, 0.75, 1.0, 1.0]    # the bottom quarter (your desk)
  ignore_regions: []

tracker:
  iou_threshold: 0.30
  # How long an object can vanish for before its entry is closed. In SECONDS,
  # not frames -- a frame count would silently mean something different every
  # time you changed fps_limit, and a borderline detection that flickers would
  # then get logged over and over as a new object.
  max_missing_seconds: 2.0
  # An object must be seen this many frames AND for this many seconds before
  # it is logged at all. Raise either if you get flickery one-off sightings;
  # min_seconds is the more useful one at high frame rates.
  min_hits: 3
  min_seconds: 0.4

storage:
  db_path: data/objectlog.db
  snapshot_dir: data/snapshots
  # Oldest sightings are deleted past this, along with their images.
  max_entries: 4000
  snapshot_max_width: 720
  snapshot_quality: 82

web:
  host: 0.0.0.0        # 0.0.0.0 = reachable from other devices on the LAN
  port: 8010
  stream: true         # the live MJPEG preview at /stream.mjpg
  stream_max_width: 640
  stream_fps: 4
  poll_ms: 1500        # how often the page asks for new sightings
